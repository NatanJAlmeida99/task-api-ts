services:
  db:
    image: postgres:15-alpine
    container_name: task_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - task_network

  api:
    build: .
    container_name: task_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_USER: postgres
      DB_PASSWORD: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskdb
    depends_on:
      - db
    networks:
      - task_network

volumes:
  pgdata:

networks:
  task_network:
    driver: bridge